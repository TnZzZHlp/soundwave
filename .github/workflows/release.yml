name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  windows-server:
    name: Windows server (cross-compiled)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 linker
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc-mingw-w64-x86-64

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-server

      - name: Build release server
        run: cargo build --release --target x86_64-pc-windows-gnu -p audio-stream-server

      - name: Package server
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-gnu/release/audio-stream-server.exe dist/
          cd dist
          sha256sum audio-stream-server.exe > SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@v4
        with:
          name: windows-server
          path: dist/*
          if-no-files-found: error

  android-apk:
    name: Android APK (signed)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install NDK and Android Rust targets
        run: |
          sdkmanager --install "ndk;27.1.12297006" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          rustup target add aarch64-linux-android x86_64-linux-android

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-native

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Restore release keystore
        env:
          SOUNDWAVE_KEYSTORE_BASE64: ${{ secrets.SOUNDWAVE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SOUNDWAVE_KEYSTORE_BASE64" ]; then
            echo "Missing SOUNDWAVE_KEYSTORE_BASE64 repository secret" >&2
            exit 1
          fi
          echo "$SOUNDWAVE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/soundwave-release.jks"

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.ref_name }}"
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "versionCode=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Assemble signed APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
          SOUNDWAVE_KEYSTORE_PATH: ${{ runner.temp }}/soundwave-release.jks
          SOUNDWAVE_KEYSTORE_PASSWORD: ${{ secrets.SOUNDWAVE_KEYSTORE_PASSWORD }}
          SOUNDWAVE_KEY_ALIAS: ${{ secrets.SOUNDWAVE_KEY_ALIAS }}
          SOUNDWAVE_KEY_PASSWORD: ${{ secrets.SOUNDWAVE_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew --no-daemon --console=plain \
            -PversionName="${{ steps.version.outputs.version }}" \
            -PversionCode="${{ steps.version.outputs.versionCode }}" \
            :app:assembleRelease

      - name: Package APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          apk="android/app/build/outputs/apk/release/app-release.apk"
          cp "$apk" "dist/soundwave-$VERSION.apk"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --print-certs "dist/soundwave-$VERSION.apk"
          cd dist
          sha256sum "soundwave-$VERSION.apk" > SHA256SUMS-android.txt

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [windows-server, android-apk]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.ref_name }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* \
              --target "$GITHUB_SHA" \
              --title "Soundwave $VERSION" \
              --generate-notes
          fi
