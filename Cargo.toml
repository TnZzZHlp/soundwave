[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/audio-common",
    "crates/transport",
    "windows-server",
    "android/app/src/main/rust",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Soundwave contributors"]

[workspace.dependencies]
anyhow = "1.0.97"
arc-swap = "1.7.1"
bytes = "1.10.1"
clap = { version = "4.5.32", features = ["derive"] }
crossbeam-channel = "0.5.15"
crossbeam-queue = "0.3.12"
jni = "0.22.4"
postcard = { version = "1.1.1", features = ["alloc"] }
quinn = { version = "0.11.6", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
qrcodegen = "1.8.0"
rcgen = "0.13.2"
rtrb = "0.3.2"
rustls = { version = "0.23.26", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.219", features = ["derive"] }
sha2 = "0.10.9"
thiserror = "2.0.12"
tokio = { version = "1.44.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.15", features = ["rt"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
windows = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
